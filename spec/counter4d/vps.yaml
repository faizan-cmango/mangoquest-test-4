vps: spec/counter4d/vps.yaml@v0.1
block: counter4d
scenarios:
  - id: VPS-01
    slug: reset
    req_ids: [REQ-3.1.1, REQ-3.1.6]
    observe: [IDD-COUNT_IF.count]
    intent: "Drive rst_n 0 for at least two falling edges with en 0, after counting has started; then release."
    expected: "count is 0 after each rising edge while rst_n is 0."
    checks: ["count == 0 while reset", "count == 0 within 1 cycles after fall(rst_n)"]
    distinguishes: {count_at: [zero, mid]}
    formal: false
  - id: VPS-02
    slug: hold
    req_ids: [REQ-3.1.3]
    observe: [IDD-COUNT_IF.count]
    intent: "Count to a mid value, drive en 0 for several cycles."
    expected: "count keeps its value while en is 0."
    checks: ["count == 5 for at least 3 cycles after fall(en)"]
    distinguishes: {count_at: [zero, mid, max]}
    formal: false
  - id: VPS-03
    slug: increment
    req_ids: [REQ-3.1.2]
    observe: [IDD-COUNT_IF.count]
    intent: "After reset, drive en 1 for several cycles."
    expected: "count increases by 1 at each rising edge."
    checks: ["count == 1 within 1 cycles after rise(en)"]
    distinguishes: {count_at: [zero, mid]}
    formal: false
  - id: VPS-04
    slug: wrap
    req_ids: [REQ-3.1.5, REQ-3.4.2]
    observe: [IDD-COUNT_IF.count]
    intent: "Count to 15 with en 1 and take one more edge."
    expected: "count goes from 15 to 0."
    checks: ["count == 0 within 1 cycles after rise(en)"]
    distinguishes: {count_at: [max, zero]}
    formal: false
  - id: VPS-05
    slug: reset_priority
    req_ids: [REQ-3.1.4]
    observe: [IDD-COUNT_IF.count]
    intent: "Drive rst_n 0 and en 1 together at a falling edge while count is non-zero."
    expected: "count becomes 0 at the next rising edge, not incremented."
    checks: ["count == 0 within 1 cycles after fall(rst_n)", "count == 0 while reset"]
    distinguishes: {count_at: [mid]}
    formal: false
  - id: VPS-06
    slug: coverage_sweep
    req_ids: [REQ-3.4.2]
    observe: [IDD-COUNT_IF.count]
    intent: "Run en 1 for more than 16 cycles so every value 0 to 15 and the wrap occur."
    expected: "Every count value 0 to 15 is seen and the wrap occurs."
    checks: ["count == 0 within 1 cycles after rise(en)"]
    distinguishes: {count_at: [zero, mid, max]}
    formal: false
environment:
  en: "0 or 1, changed only at falling edges of clk"
  rst_n: "0 or 1, changed only at falling edges of clk"
  illegal_inputs: ["any input change at a rising edge of clk"]
retired: {}
