idd: IDD-COUNT_IF
version: "0.1"
block: counter4d
side: slave
protocol_class: level
sad_section: "3.1"
clock: clk
reset: rst_n
ports:
  - {name: clk, dir: in, width: 1, type: logic, req: REQ-3.1.6, reset_value: n/a, meaning: "100 MHz clock; all behaviour on its rising edge"}
  - {name: rst_n, dir: in, width: 1, type: logic, req: REQ-3.1.1, reset_value: n/a, meaning: "Synchronous reset, active low"}
  - {name: en, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "Count enable, level"}
  - {name: count, dir: out, width: 4, type: logic, req: REQ-3.1.2, reset_value: 0, meaning: "Counter value, 0 to 15"}
omitted_signals: []
rules:
  - {id: R1, holder: environment, req: REQ-3.4.1, text: "en and rst_n change only at falling edges of clk, never at a rising edge."}
  - {id: R2, holder: block, req: REQ-3.1.1, text: "count is 0 after the first rising edge of clk with rst_n at 0; its value before that edge is unspecified."}
timing:
  - {req: REQ-3.1.2, clock: clk, from: "rising edge with rst_n 1 and en 1", to: "count shows previous value plus 1", cycles: 1, text: "Increment is visible after one clock edge."}
  - {req: REQ-3.1.1, clock: clk, from: "rising edge with rst_n 0", to: "count equals 0", cycles: 1, text: "Reset takes effect at the edge."}
corner_cases:
  - {id: C1, req: REQ-3.1.5, text: "count 15 with en 1 wraps to 0.", vps: VPS-04}
  - {id: C2, req: REQ-3.1.4, text: "rst_n 0 with en 1 gives 0.", vps: VPS-05}
  - {id: C3, req: REQ-3.1.3, text: "en 0 holds the value.", vps: VPS-02}
errata_applied: []
